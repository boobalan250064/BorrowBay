{% extends "base.html" %}

{% block title %}Edit Product - BorrowBay{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Edit Product</h1>

    <form method="POST">

        <label>Product Name</label>

        <input
            type="text"
            name="name"
            value="{{ product.name }}"
            required
        >

        <label>Description</label>

        <textarea
            name="description"
            required
        >{{ product.description }}</textarea>

        <label>Category</label>

        <input
            type="text"
            name="category"
            value="{{ product.category }}"
            required
        >

        <label>Condition</label>

        <select name="condition">

            <option
                {% if product.condition == "New" %}
                selected
                {% endif %}
            >
                New
            </option>

            <option
                {% if product.condition == "Good" %}
                selected
                {% endif %}
            >
                Good
            </option>

            <option
                {% if product.condition == "Used" %}
                selected
                {% endif %}
            >
                Used
            </option>

        </select>

        <label>Price</label>

        <input
            type="number"
            name="price"
            value="{{ product.price }}"
            min="0"
            step="0.01"
            required
        >

        <button
            type="submit"
            class="btn"
        >

            Save Changes

        </button>

    </form>

</div>

{% endblock %}
