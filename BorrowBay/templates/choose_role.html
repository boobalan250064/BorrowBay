<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BorrowBay</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- TOP NAVIGATION -->
    <header class="top-header">

        <div class="brand">
            <div class="brand-bag">B</div>
            <div class="brand-text">
                Borrow<span>Bay</span>
            </div>
        </div>

        <a href="{{ url_for('dashboard.home') }}" class="account">
            <span class="account-icon">●</span>
            My Account
            <span class="arrow-down">⌄</span>
        </a>

    </header>


    <!-- MAIN SECTION -->
    <main class="role-page">

        <h1 class="borrowbay-title">
            Borrow<span>Bay</span>
        </h1>

        <p class="tagline">
            Share
            <span>•</span>
            Buy
            <span>•</span>
            Save
        </p>


        <!-- SELLER + BUYER -->
        <section class="role-container">

            <!-- SELLER -->
            <div class="role-card">

                <div class="role-icon seller-icon">
                    +
                </div>

                <h2>SELLER</h2>

                <p>
                    Upload your product and let everyone
                    know about it.
                </p>

                <a href="{{ url_for('products.seller_page') }}"
                   class="role-button">

                    Sell a Product
                    <span>→</span>

                </a>

            </div>


            <!-- BUYER -->
            <div class="role-card">

                <div class="role-icon buyer-icon">
                    🛒
                </div>

                <h2>BUYER</h2>

                <p>
                    Browse available products
                    from other users.
                </p>

                <a href="{{ url_for('products.browse_products') }}"
                   class="role-button">

                    Browse Products
                    <span>→</span>

                </a>

            </div>

        </section>

    </main>

</body>
</html>
